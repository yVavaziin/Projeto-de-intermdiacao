# Nome da aplicação
spring.application.name=meu-projeto-api

# Porta do servidor
server.port=8081

# Configurações do PostgreSQL (Substituindo o MySQL)
# Certifique-se de que o banco 'ecoconnect_db' foi criado no Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/ecoconnect_db
spring.datasource.username=postgres
spring.datasource.password=

# Driver e Dialeto específicos para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true