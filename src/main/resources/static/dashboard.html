<main class="dashboard-container">
    <section class="card-cadastro">
        <h2>📦 Cadastre seu Descarte</h2>
        <form id="formResiduo">
            <div class="input-group">
                <label>O que você quer descartar?</label>
                <input type="text" id="tituloItem" placeholder="Ex: 20kg de Orgânicos ou Fogão Industrial" required>
            </div>

            <div class="input-group">
                <label>Categoria</label>
                <select id="tipoResiduo">
                    <option value="ORGANICO">Resíduo Orgânico (Restos de Comida)</option>
                    <option value="ELETRONICO">Eletrônicos (Computadores, Cabos)</option>
                    <option value="MAQUINARIO">Maquinário (Geladeiras, Fogões, Maquinas)</option>
                    <option value="RECICLAVEL">Recicláveis (Plástico, Papel, Vidro)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Adicionar Foto</label>
                <input type="file" id="fotoItem" accept="image/*">
            </div>

            <button type="submit" class="btn-enviar">Publicar para Coleta</button>
        </form>
    </section>

    <section class="card-empresas">
        <h3>🚚 Empresas de Coleta em Brasília</h3>
        <div id="listaEmpresas">
            <p>Buscando empresas parceiras...</p>
        </div>
    </section>

    <section class="card-lista">
        <h3>📋 Meus Itens Publicados</h3>
        <table id="tabelaMeusItens">
            <thead>
            <tr>
                <th>Item</th>
                <th>Tipo</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </section>
</main>
