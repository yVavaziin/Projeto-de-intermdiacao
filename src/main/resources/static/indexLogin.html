<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoConnect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-body">

<header>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: white;">Eco<span>Connect</span></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="cadastro.html" class="btn-nav">Cadastrar</a></li>
        </ul>
    </nav>
</header>

<main class="login-container">
    <div class="login-box">
        <h2>Bem-vindo <span>de volta!</span></h2>
        <p>Acesse sua conta para gerenciar suas coletas.</p>

        <form action="#">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
            </div>

            <div class="login-options">
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox"> Lembrar de mim
                </label>
                <a href="#">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="login-footer">
            <p>Ainda não tem conta? <a href="cadastro.html">Crie uma agora</a></p>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 EcoConnect - Todos os direitos reservados.</p>
</footer>

</body>
</html>
