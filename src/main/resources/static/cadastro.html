<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - EcoConnect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body class="cadastro-body">

<header>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: white;">Eco<span>Connect</span></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html" class="btn-nav">Já tenho conta</a></li>
        </ul>
    </nav>
</header>

<main class="cadastro-container">
    <div class="cadastro-box">
        <h2>Crie seu <span>Acesso</span></h2>
        <p>Preencha os dados abaixo para acessar o sistema.</p>

        <form id="formCadastro">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Como quer ser chamado?" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail (Seu Login)</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required>
            </div>

            <div class="input-group">
                <label for="confirmar-senha">Confirmar Senha</label>
                <input type="password" id="confirmar-senha" placeholder="Repita a senha" required>
            </div>

            <input type="hidden" id="endereco" value="Brasília, DF">
            <input type="hidden" id="tipoEstabelecimento" value="Restaurante">
            <input type="hidden" id="tiposResiduos" value="Orgânico">

            <button type="submit" class="btn-cadastro">Criar Conta e Entrar</button>
        </form>

        <div id="mensagem" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>

        <div class="cadastro-footer">
            <p>Já possui acesso? <a href="indexLogin.html">Fazer Login</a></p>
        </div>
    </div>
</main>

<script src="script.js"></script>

<footer>
    <p>&copy; 2026 EcoConnect - Todos os direitos reservados.</p>
</footer>

</body>
</html>
